org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Windows build stability - KSP replaces KAPT so the in-process strategy
# workaround is no longer needed. Keep vfs.watch=false to prevent the file
# system watcher from holding directory handles between builds.
org.gradle.vfs.watch=false
org.gradle.daemon.idletimeout=20000
org.gradle.daemon=true
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Disable Kotlin incremental compilation to avoid Windows file-lock errors
# when the compiler tries to delete its cache between builds.
kotlin.incremental=false
