name: Build Android Release (.aab & .apk)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build Release Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore Keystore from Secret (if provided)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release.keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          else
            echo "Using repository keystore (if present)..."
          fi

      - name: Build Release AAB & APK
        env:
          MOMO_STORE_PASSWORD: ${{ secrets.MOMO_STORE_PASSWORD }}
          MOMO_KEY_PASSWORD: ${{ secrets.MOMO_KEY_PASSWORD }}
          MOMO_KEY_ALIAS: ${{ secrets.MOMO_KEY_ALIAS || 'releaseKey' }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: SwiftAgent-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: SwiftAgent-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
